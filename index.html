<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>NEXUS OS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="desktop" id="desktop">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">N</span><span>NEXUS</span></div>
      <div class="top-center" id="clock">--:--</div>
      <div class="top-actions">
        <button class="top-icon" aria-label="Open Control Centre notifications" id="notificationButton" title="Notifications">◉</button>
        <button class="status-pill" id="controlButton"><span>⌁</span> Control Centre <span class="chevron">⌄</span></button>
      </div>
    </header>
    <section class="desktop-welcome">
      <p class="eyebrow">PERSONAL WORKSPACE</p>
      <h1>Good evening.</h1>
      <p class="welcome-sub">A quieter space to get things done.</p>
    </section>
    <div class="desktop-shortcuts" id="shortcuts">
      <button class="shortcut" data-app="files"><span class="shortcut-icon">▤</span><span>Files</span></button>
      <button class="shortcut" data-app="notes"><span class="shortcut-icon">✎</span><span>Notes</span></button>
      <button class="shortcut" data-app="settings"><span class="shortcut-icon">⚙</span><span>Settings</span></button>
      <button class="shortcut" data-app="gaming"><span class="shortcut-icon">⌘</span><span>Gaming</span></button>
    </div>
    <div class="dock-wrap"><nav class="dock" aria-label="Application dock">
      <button class="dock-app launcher-app" id="launcherButton" title="App launcher">◈</button>
      <span class="dock-separator"></span>
      <button class="dock-app" data-app="files" title="Files">▤</button>
      <button class="dock-app" data-app="browser" title="Browser">◉</button>
      <button class="dock-app" data-app="notes" title="Notes">✎</button>
      <button class="dock-app" data-app="terminal" title="Terminal">⌘</button>
      <button class="dock-app" data-app="gaming" title="Gaming Hub">🎮</button>
      <span class="dock-separator"></span>
      <button class="dock-app" data-app="settings" title="Settings">⚙</button>
    </nav></div>
    <div class="panel control-panel hidden" id="controlPanel">
      <div class="panel-heading"><div><h2>Control Centre</h2><p>Quick settings</p></div><button class="close-btn" data-close="controlPanel">×</button></div>
      <div class="toggle-grid">
        <button class="tile active" data-toggle="wifi" aria-pressed="true"><span>⌁</span><b>Wi-Fi</b><small>On · preview</small></button>
        <button class="tile" data-toggle="bluetooth" aria-pressed="false"><span>ᛒ</span><b>Bluetooth</b><small>Off · preview</small></button>
        <button class="tile" data-toggle="dnd" aria-pressed="false"><span>◐</span><b>Do Not Disturb</b><small>Off · preview</small></button>
        <button class="tile" data-toggle="power" aria-pressed="false"><span>ϟ</span><b>Power Saver</b><small>Off · preview</small></button>
      </div>
      <div class="slider-row"><label for="brightness">Brightness</label><div class="slider-control"><input id="brightness" type="range" min="35" max="100" value="100"><output id="brightnessValue" for="brightness">100%</output></div></div>
      <div class="slider-row"><label for="volume">Volume</label><div class="slider-control"><input id="volume" type="range" min="0" max="100" value="65"><output id="volumeValue" for="volume">65%</output></div></div>
      <section class="notification-section" id="controlNotifications" aria-labelledby="notificationHeading">
        <div class="notification-heading"><h3 id="notificationHeading">Notifications</h3><button class="clear-notifications" id="clearNotifications" type="button">Clear</button></div>
        <div id="notificationList" aria-live="polite"><div class="notification-empty"><p>You're all caught up.</p><small>Notifications will appear here.</small></div></div>
      </section>
      <div class="panel-foot">Preview controls only — hardware settings are not connected in this browser build.</div>
    </div>
    <section class="launcher hidden" id="launcher">
      <div class="launcher-search"><span>⌕</span><input id="appSearch" type="search" placeholder="Search applications…" aria-label="Search applications"></div>
      <div class="app-grid" id="appGrid">
        <button class="app-item" data-app="files"><span>▤</span>Files</button><button class="app-item" data-app="browser"><span>◉</span>Browser</button>
        <button class="app-item" data-app="notes"><span>✎</span>Notes</button><button class="app-item" data-app="terminal"><span>⌘</span>Terminal</button>
        <button class="app-item" data-app="gaming"><span>🎮</span>Gaming Hub</button><button class="app-item" data-app="monitor"><span>▥</span>System Monitor</button>
        <button class="app-item" data-app="settings"><span>⚙</span>Settings</button><button class="app-item" data-app="calculator"><span>＋</span>Calculator</button>
      </div>
    </section>
    <section class="window hidden" id="appWindow" aria-live="polite">
      <div class="window-titlebar"><div class="window-controls"><button class="window-control close" id="windowClose" aria-label="Close">×</button><button class="window-control minimize" id="windowMin" aria-label="Minimize">−</button></div><span id="windowTitle">Application</span><button class="window-control maximize" id="windowMax" aria-label="Maximize">□</button></div>
      <div class="window-content" id="windowContent"></div>
    </section>
    <div class="toast hidden" id="toast"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
