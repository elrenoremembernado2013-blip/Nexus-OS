[General]
__userfile__=true
panels=panel1

[panel1]
alignment=0
animation-duration=0
background-color=@Variant(\0\0\0\x43\x1\xff\xff\x0c\x0c\x13\x13$$\xff\xff\0\0)
background-opacity=92
desktop=0
font-color=@Variant(\0\0\0\x43\x1\xff\xff\xee\xee\xf4\xf4\xff\xff\0\0)
hidable=false
iconSize=22
length=100
length-percent=true
lineCount=1
panelSize=36
plugins=mainmenu, quicklaunch, taskbar, spacer, desktopswitch, volume, tray, statusnotifier, clock, showdesktop
position=Bottom
reserve-space=true
screen-num=0

[mainmenu]
filterClear=true
filterMenu=true
filterShow=true
icon=/usr/local/share/nexus-os/branding/nexus-logo.svg
ownBackgroundFile=false
showText=true
text=NEXUS
type=mainmenu

[quicklaunch]
alignment=Left
apps\1\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\2\desktop=/usr/share/applications/qterminal.desktop
apps\3\desktop=/usr/share/applications/featherpad.desktop
apps\4\desktop=/usr/share/applications/qps.desktop
apps\5\desktop=/usr/share/applications/lxqt-config.desktop
apps\6\desktop=/usr/local/share/applications/nexus-installer.desktop
apps\size=6
type=quicklaunch

[taskbar]
alignment=Left
buttonStyle=IconText
closeOnMiddleClick=true
grouping=true
iconByClass=false
raiseOnCurrentDesktop=true
showOnlyCurrentDesktopTasks=false
type=taskbar

[spacer]
size=8
type=spacer
width=8

[desktopswitch]
rows=1
type=desktopswitch

[volume]
mixerCommand=pavucontrol-qt
showOnClick=true
type=volume

[tray]
type=tray

[statusnotifier]
type=statusnotifier

[clock]
clockFormat=HH:mm
dateFormat=yyyy-MM-dd
showDate=true
timeFormat=HH:mm
type=clock

[showdesktop]
type=showdesktop
