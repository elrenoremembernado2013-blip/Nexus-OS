# NEXUS Lite (512 MB Experimental / 1 GB) guest defaults — based on Linux Mint 22.3 (Ubuntu 24.04 Noble)
NEXUS_EDITION=lite
NEXUS_BASE_DISTRO=linuxmint
NEXUS_BASE_VERSION=22.3
NEXUS_BASE_UBUNTU_CODENAME=noble
NEXUS_TARGET_ARCH=x86_64
NEXUS_MIN_EXPERIMENTAL_RAM_MB=512
NEXUS_RECOMMENDED_LITE_RAM_MB=1024
NEXUS_DESKTOP_SHELL=openbox
NEXUS_PANEL=tint2
NEXUS_FILE_MANAGER=pcmanfm
NEXUS_TERMINAL=lxterminal
NEXUS_DISPLAY_MANAGER=lightdm
NEXUS_COMPOSITOR=none
NEXUS_ZRAM_ALGO=zstd
NEXUS_ZRAM_PERCENT=50
