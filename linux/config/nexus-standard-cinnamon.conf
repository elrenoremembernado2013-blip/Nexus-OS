# NEXUS Standard (Flagship Cinnamon Edition) defaults — Linux Mint 22.3 (Ubuntu 24.04 Noble)
# Target hardware: >= 2048 MiB RAM minimum (4096 MiB recommended), >= 20 GiB storage.
NEXUS_EDITION=standard
NEXUS_BASE_DISTRO=linuxmint
NEXUS_BASE_VERSION=22.3
NEXUS_BASE_EDITION=cinnamon
NEXUS_BASE_UBUNTU_CODENAME=noble
NEXUS_TARGET_ARCH=x86_64
NEXUS_MIN_RAM_MB=2048
NEXUS_TARGET_RAM_MB=4096
NEXUS_TARGET_STORAGE_GB=32
NEXUS_DISPLAY_PROTOCOL=x11
NEXUS_INIT_SYSTEM=systemd
NEXUS_BOOTLOADER=grub
NEXUS_FIRMWARE=uefi
NEXUS_QEMU_FIRMWARE=ovmf
NEXUS_QEMU_MACHINE=q35
NEXUS_DESKTOP_COMPOSITOR=muffin
NEXUS_DESKTOP_SHELL=cinnamon
NEXUS_DESKTOP_UI_TOOLKIT=gtk
