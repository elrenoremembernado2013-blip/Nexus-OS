name: NEXUS browser preview

on:
  workflow_dispatch:
  push:
    branches:
      - nexus-linux-foundation
    paths:
      - app.js
      - index.html
      - styles.css
      - apps/**
      - assets/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/nexus-linux-foundation'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out development branch
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage browser prototype only
        run: |
          mkdir -p site
          cp index.html app.js styles.css site/
          cp -R apps assets site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
