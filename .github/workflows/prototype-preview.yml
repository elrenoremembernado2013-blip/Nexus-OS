name: NEXUS checks and browser preview

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - nexus-linux-foundation
      - arena/f18c36a4-nexus-os

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shellcheck and desktop-file-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils
      - name: Run ShellCheck on added/modified scripts
        run: shellcheck scripts/check-native-launchers.sh linux/branding/nexus-launch-app.sh linux/mint/nexus-firstboot.sh linux/mint/nexus-gaming-cli.sh linux/lite/provision-nexus-lite.sh linux/lite/scripts/provision-nexus-lite-lxqt.sh linux/mint/provision-nexus-guest.sh
      - name: Validate .desktop launchers
        run: desktop-file-validate linux/branding/applications/*.desktop linux/branding/nexus-firstboot.desktop
      - name: Run foundation and prototype checks
        run: bash scripts/check-foundation.sh

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nexus-linux-foundation'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage browser prototype only
        run: |
          mkdir -p site
          cp index.html app.js styles.css site/
          cp -R apps assets site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
