name: Build NEXUS ISOs and QEMU RAM Matrix

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "ISO edition to build & test"
        type: choice
        options:
          - all
          - lite
          - cinnamon
          - xfce
        required: true
        default: "all"
      boot_seconds:
        description: "UEFI boot check window per RAM tier (seconds)"
        required: true
        default: "45"
      primary_idle:
        description: "Primary-tier guest idle probe duration (seconds)"
        required: true
        default: "300"
  push:
    branches:
      - arena/33e911d5-nexus-os
    paths:
      - "linux/**"
      - "scripts/download-linux-mint.sh"
      - "scripts/launch-qemu.sh"
      - ".github/workflows/iso-and-qemu-validation.yml"

permissions:
  contents: read

concurrency:
  group: iso-qemu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute edition matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EDITION: ${{ github.event.inputs.edition || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          event_name = os.environ["EVENT_NAME"]
          selected = "all" if event_name == "push" else os.environ.get("INPUT_EDITION", "all")
          entries = [
              {"edition": "lite", "base_edition": "xfce", "ram_matrix": "512 768 1024 2048"},
              {"edition": "cinnamon", "base_edition": "cinnamon", "ram_matrix": "2048 4096"},
              {"edition": "xfce", "base_edition": "xfce", "ram_matrix": "4096"},
          ]
          if selected != "all":
              entries = [e for e in entries if e["edition"] == selected]
          print("matrix=" + json.dumps(entries))
          PY

  iso-and-qemu:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install ISO remastering, cpio, and QEMU/OVMF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash coreutils curl gnupg xorriso squashfs-tools \
            qemu-system-x86 qemu-utils ovmf shellcheck cpio gzip \
            initramfs-tools-core zstd xz-utils

      - name: Validate scripts and edition configs before build
        run: |
          bash linux/build/validate-packages.sh linux/config/mint-packages.list
          bash linux/build/validate-packages.sh linux/config/cinnamon-packages.list
          bash linux/build/validate-packages.sh linux/lite/lite-packages.list

      - name: Download and GPG-verify Linux Mint 22.3 base ISO (${{ matrix.base_edition }})
        run: bash scripts/download-linux-mint.sh --edition "${{ matrix.base_edition }}"

      - name: Build and verify NEXUS ${{ matrix.edition }} ISO
        run: |
          if [ "${{ matrix.edition }}" = "lite" ]; then
            sudo bash linux/lite/build-nexus-lite-iso.sh
          else
            sudo bash linux/build/build-nexus-iso.sh --edition "${{ matrix.edition }}"
          fi
          bash linux/build/verify-nexus-iso.sh --edition "${{ matrix.edition }}"
          (cd build/iso/out && sha256sum -c "nexus-os-22.3-${{ matrix.edition }}-amd64.iso.sha256")
          iso_sha="$(awk '{print $1}' "build/iso/out/nexus-os-22.3-${{ matrix.edition }}-amd64.iso.sha256")"
          iso_bytes="$(stat -c %s "build/iso/out/nexus-os-22.3-${{ matrix.edition }}-amd64.iso")"
          echo "::notice title=NEXUS-ISO-${{ matrix.edition }}::file=nexus-os-22.3-${{ matrix.edition }}-amd64.iso bytes=${iso_bytes} sha256=${iso_sha}"
          sudo rm -rf "build/iso/work-${{ matrix.edition }}" build/downloads/*.iso

      - name: Run Graphical + Install + 3-Reboot QEMU RAM matrix (${{ matrix.ram_matrix }} MiB)
        run: |
          boot_sec="${{ github.event.inputs.boot_seconds || '35' }}"
          primary_idle="${{ github.event.inputs.primary_idle || '120' }}"
          set +e
          bash linux/test/run-qemu-validation.sh \
            --edition "${{ matrix.edition }}" \
            --ram-matrix "${{ matrix.ram_matrix }}" \
            --boot-seconds "$boot_sec" \
            --idle-seconds 30 \
            --primary-idle "$primary_idle" \
            --graphical \
            --install-test \
            --reliability > /tmp/qemu-runner.log 2>&1
          rc=$?
          set -e
          cat /tmp/qemu-runner.log
          if [ "$rc" -ne 0 ]; then
            err_tail="$(tail -n 15 /tmp/qemu-runner.log | tr '\n' ' ' | cut -c1-1000)"
            echo "::error title=NEXUS-QEMU-ERR-${{ matrix.edition }}::rc=${rc} ${err_tail}"
            exit "$rc"
          fi
          python3 - "build/qemu-test/qemu-results-${{ matrix.edition }}.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"::notice title=NEXUS-QEMU-META-{data['edition']}::accel={data['accel']} graphical={data['graphical']} install_test={data.get('install_test')} runs={len(data['runs'])}")
          for r in data["runs"]:
              live_r = r.get("live_reps") or []
              l0 = live_r[0] if live_r else {}
              ir0 = l0.get("install_report") or {}
              iboot = r.get("installed_boots") or []
              compact_boots = []
              for b in iboot:
                  st = b.get("stages") or {}
                  zp = b.get("zram_pressure") or {}
                  compact_boots.append({
                      "boot": b.get("boot_num"),
                      "src": b.get("source"),
                      "vda": b.get("booted_from_vda"),
                      "no_iso": b.get("live_iso_absent"),
                      "efi": b.get("efi_boot_ok"),
                      "login": b.get("login_success"),
                      "desk": b.get("graphical_session_success"),
                      "panel_map": b.get("panel_win_mapped"),
                      "wm_s": b.get("wm_ready_sec"),
                      "pnl_s": b.get("panel_ready_sec"),
                      "apps": b.get("application_test_success"),
                      "clean": b.get("windows_closed_cleanup"),
                      "persist": (b.get("persistence") or {}).get("persistence_verified"),
                      "net": (b.get("network") or {}).get("nmcli_state"),
                      "err": (b.get("installed_checks") or {}).get("journal_err_count"),
                      "fail_u": (b.get("installed_checks") or {}).get("failed_systemd_units"),
                      "zram": zp.get("status") if not zp.get("skipped") else "N/A",
                      "mem": {k: {
                          "u": v.get("used_ram_mib"),
                          "a": v.get("available_ram_mib"),
                          "c": v.get("cached_mib"),
                          "sw": v.get("swap_used_mib"),
                          "cpu": v.get("cpu_usage_pct"),
                          "oom": v.get("oom_kill_count"),
                          "zr": (v.get("zram") or [{}])[0].get("compression_ratio") if v.get("zram") else None,
                      } for k, v in st.items()},
                      "shots": [(s.get("name"), s.get("non_black_pct")) for s in (b.get("screenshots") or [])],
                  })
              summary = {
                  "ram": r.get("ram_mib"),
                  "uefi": r.get("uefi_boot_success"),
                  "live": f"{r.get('live_successes')}/{r.get('live_attempts')}",
                  "inst": f"{r.get('install_successes')}/{r.get('install_attempts')}",
                  "iboot": f"{r.get('installed_boot_successes')}/{r.get('installed_boot_attempts')}",
                  "persist": r.get("persistence_verified"),
                  "ub_ui": (l0.get("ubiquity_ui") or {}).get("window_verified"),
                  "inst_sec": ir0.get("elapsed_sec"),
                  "inst_efi": ir0.get("bootloader_efi_ok"),
                  "live_shots": [(s.get("name"), s.get("non_black_pct")) for s in (l0.get("screenshots") or [])],
                  "live_glx": (l0.get("desktop") or {}).get("glx_diag"),
                  "cinn_2g_virtio": r.get("cinnamon_2g_virtio_diag"),
                  "boots": compact_boots,
              }
              print(f"::notice title=NEXUS-123-{data['edition']}-{r.get('ram_mib')}M::" + json.dumps(summary, separators=(",", ":")))
          PY

      - name: Upload ISO, SHA-256, and build metadata (${{ matrix.edition }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-iso-${{ matrix.edition }}
          if-no-files-found: warn
          path: |
            build/iso/out/nexus-os-22.3-${{ matrix.edition }}-amd64.iso
            build/iso/out/nexus-os-22.3-${{ matrix.edition }}-amd64.iso.sha256
            build/iso/out/nexus-os-22.3-${{ matrix.edition }}-amd64.iso.build-info.json

      - name: Upload QEMU results, serial logs, and screenshots (${{ matrix.edition }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-qemu-results-${{ matrix.edition }}
          if-no-files-found: warn
          path: build/qemu-test/
