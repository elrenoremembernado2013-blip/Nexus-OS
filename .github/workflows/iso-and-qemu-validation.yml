name: Build NEXUS ISOs and QEMU RAM Matrix

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "ISO edition to build & test"
        type: choice
        options:
          - all
          - lite
          - cinnamon
          - xfce
        required: true
        default: "all"
      boot_seconds:
        description: "Headless QEMU boot observation window per RAM tier (seconds)"
        required: true
        default: "120"
  push:
    branches:
      - arena/33e911d5-nexus-os
    paths:
      - "linux/**"
      - "scripts/download-linux-mint.sh"
      - "scripts/launch-qemu.sh"
      - ".github/workflows/iso-and-qemu-validation.yml"

permissions:
  contents: read

concurrency:
  group: iso-qemu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute edition matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EDITION: ${{ github.event.inputs.edition || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          event_name = os.environ["EVENT_NAME"]
          selected = "all" if event_name == "push" else os.environ.get("INPUT_EDITION", "all")
          entries = [
              {"edition": "lite", "base_edition": "xfce", "ram_matrix": "512 768 1024 2048 4096"},
              {"edition": "cinnamon", "base_edition": "cinnamon", "ram_matrix": "2048 4096"},
              {"edition": "xfce", "base_edition": "xfce", "ram_matrix": "4096"},
          ]
          if selected != "all":
              entries = [e for e in entries if e["edition"] == selected]
          print("matrix=" + json.dumps(entries))
          PY

  iso-and-qemu:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install ISO remastering and QEMU/OVMF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash coreutils curl gnupg xorriso squashfs-tools \
            qemu-system-x86 qemu-utils ovmf shellcheck

      - name: Validate scripts and edition configs before build
        run: |
          bash linux/build/validate-packages.sh linux/config/mint-packages.list
          bash linux/build/validate-packages.sh linux/config/cinnamon-packages.list
          bash linux/build/validate-packages.sh linux/lite/lite-packages.list

      - name: Download and GPG-verify Linux Mint 22.3 base ISO (${{ matrix.base_edition }})
        run: bash scripts/download-linux-mint.sh --edition "${{ matrix.base_edition }}"

      - name: Build and verify NEXUS ${{ matrix.edition }} ISO
        run: |
          if [ "${{ matrix.edition }}" = "lite" ]; then
            sudo bash linux/lite/build-nexus-lite-iso.sh
          else
            sudo bash linux/build/build-nexus-iso.sh --edition "${{ matrix.edition }}"
          fi
          bash linux/build/verify-nexus-iso.sh --edition "${{ matrix.edition }}"
          (cd build/iso/out && sha256sum -c "nexus-os-22.3-${{ matrix.edition }}-amd64.iso.sha256")
          cat "build/iso/out/nexus-os-22.3-${{ matrix.edition }}-amd64.iso.sha256"
          cat "build/iso/out/nexus-os-22.3-${{ matrix.edition }}-amd64.iso.build-info.json"
          sudo rm -rf "build/iso/work-${{ matrix.edition }}" build/downloads/*.iso

      - name: Run QEMU RAM matrix (${{ matrix.ram_matrix }} MiB)
        run: |
          boot_sec="${{ github.event.inputs.boot_seconds || '120' }}"
          bash linux/test/run-qemu-validation.sh \
            --edition "${{ matrix.edition }}" \
            --ram-matrix "${{ matrix.ram_matrix }}" \
            --boot-seconds "$boot_sec"
          cat "build/qemu-test/qemu-results-${{ matrix.edition }}.json"

      - name: Upload ISO, SHA-256, and build metadata (${{ matrix.edition }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-iso-${{ matrix.edition }}
          if-no-files-found: warn
          path: |
            build/iso/out/nexus-os-22.3-${{ matrix.edition }}-amd64.iso
            build/iso/out/nexus-os-22.3-${{ matrix.edition }}-amd64.iso.sha256
            build/iso/out/nexus-os-22.3-${{ matrix.edition }}-amd64.iso.build-info.json

      - name: Upload QEMU results, serial logs, and screenshots (${{ matrix.edition }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-qemu-results-${{ matrix.edition }}
          if-no-files-found: warn
          path: build/qemu-test/
